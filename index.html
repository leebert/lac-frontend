<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="src/assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="src/assets/favicon/site.webmanifest">
  <title>Life Admin Copilot</title>
</head>

<body>
  <div class="header">
    <h1>Life Admin Copilot</h1>
    <div class="modal-buttons">
      <button id="btn-column" class="icon-button"><img src="/src/assets/modal.svg" alt="Column"></button>
      <button id="btn-modal" class="icon-button inactive"><img src="/src/assets/stack.svg" alt="Modal"></button>
    </div>
  </div>

  <div id="error-container" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>Error</h2>
      <div id="error-message"></div>
      <button id="error-dismiss-button" class="modal-button">OK</button>
    </div>
  </div>
  
  <div id="checklist-modal" class="checklist-modal">
    <div class="checklist-modal-content">
      <div class="checklist-modal-header">
        <h2>Checklist</h2>
        <button id="checklist-modal-close" class="checklist-modal-close">✕</button>
      </div>
      <div id="checklist-modal-list" class="checklist-modal-list"></div>
    </div>
  </div>

  <main>

    <div class="grid-column conversation-column">
      <button id="floating-checklist-btn" class="floating-checklist-btn icon-button">
        <span id="floating-checklist-count">0</span>
      </button>
      <h2>Conversation</h2>
      <div id="chat-history"></div>

    <div id="input-container">
      <textarea id="message-input" class="input" rows="1"></textarea>
      <button id="send-button" class="icon-button"><img src="/src/assets/send.svg" alt="Back"></button>
    </div>

    <div class="token-usage">
      <div id="token-summarization">100% before summary</div>
      <div id="token-limit">100% before limit</div>
    </div>
    </div>


    <div class="grid-column checklist-column collapsed">
      <div class="checklist-header">
        <div>
          <h2>Checklist</h2>
          <span id="checklist-count" class="checklist-count">(0)</span>
        </div>
        <img src="/src/assets/norgie.svg" alt="Expand/Collapse Icon">
      </div>
      <div id="todo-list">Ask for advice to see next steps.</div>
    </div>
  </main>

  <div id="turnstile-modal" class="password-modal hidden">
    <div class="password-modal-content">
      <h2>Just checking you're human…</h2>
      <p>This quick, automatic check protects the live AI demo from abuse.</p>
      <div id="turnstile-container"></div>
      <div id="turnstile-error" class="password-error hidden"></div>
    </div>
  </div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
